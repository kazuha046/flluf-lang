name: Build and Release Rust CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: flluf-linux-amd64
            asset_name: flluf-linux-amd64
            binary_path: target/x86_64-unknown-linux-gnu/release/flluf

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: flluf-windows-amd64
            asset_name: flluf-windows-amd64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/flluf.exe

    steps:
      - name: 🛎 Checkout repo
        uses: actions/checkout@v4

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: ⚙️ Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: 📦 Build Rust CLI
        run: cargo build --release --target ${{ matrix.target }}

      - name: 🏷️ Rename binary for Release
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.binary_path }} dist/${{ matrix.asset_name }}

      - name: 📤 Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

      - name: 🚀 Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
